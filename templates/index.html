{% extends 'base.html'%}
{% block content %}
{% for user in user_list %}      <!-- user_list kommt aus render_template; user = ein User pro Durchlauf -->
<div>
  ----
  <h2>ID {{user.id}} : "{{ user.name }}" </h2>   <!-- Spalten id und name aus models.py -->

<form action="/users" method="post">
  <input type="text" name="usr_name">
  <button type="submit">Add user</button>
</form>
{% endblock %}
