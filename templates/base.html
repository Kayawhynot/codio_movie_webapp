<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <title>MoviWeb</title>
    {# url_for baut den Pfad zu einer Datei im Ordner static/ #}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>MoviWeb</h1>                              {# Kopf, erscheint auf jeder Seite #}
        <nav><a href="{{ url_for('home') }}">Home</a></nav>
        {# url_for('home') nimmt den NAMEN der Funktion home() aus app.py, nicht die Adresse #}
    </header>
    <main class="container">
        {% block content %}{% endblock %}             {# das Loch: jede Unterseite füllt es #}
    </main>
</body>
</html>
